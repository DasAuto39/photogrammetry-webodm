services:
  web_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: persepsi-robot:latest
    container_name: pr-container
    network_mode: "host"
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./datasets:/app/datasets
      - ./output:/app/output
    restart: unless-stopped